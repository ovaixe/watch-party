[project]
name = "watch-party-backend"
version = "1.0.0"
description = "Watch Party backend - FastAPI + Socket.IO synchronized YouTube viewing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-socketio>=5.11",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
